name: Release
# Push a tag vX.Y.Z matching the version in openapi-generator.yaml.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches the package version
        run: |
          version=$(scripts/version.sh)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in openapi-generator.yaml"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
      - name: Build and call the live API
        run: scripts/smoke.sh
      - name: Make the version visible on pkg.go.dev
        run: curl -fsS "https://proxy.golang.org/github.com/${GITHUB_REPOSITORY,,}/@v/${GITHUB_REF_NAME}.info"
