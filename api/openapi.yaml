        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                  - ID: 1
                    name: "1688"
                    favourite: 0
                  - ID: 2
                    name: 1Q
                    favourite: 0
                  - ID: 3
                    name: 1StopMove
