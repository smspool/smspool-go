openapi: 3.0.3
info:
  description: |-
    Every endpoint accepts its parameters as form fields (POST) or query parameters (GET). A JSON object body (`Content-Type: application/json`) works too: its top-level fields are read as parameters; a parameter that is also in the query string or form body wins.

    Authenticate with your API key from https://www.smspool.net/my/settings as a bearer token: `Authorization: Bearer <key>`. A `key` field in a POST body works too. Keep the key out of the URL: a URL is saved in browser history and can be recorded by proxies and logs on the way to us.

    Use of the API is subject to the [Terms of Service](https://www.smspool.net/tos#api). Article 11 covers API use: sanctions and geographic restrictions, what you must require of your own users if you resell the service, and the safekeeping of keys.

    ## Errors

    An error answers with `success: 0`, a human-readable `message` and, where the API can name the cause, a machine-readable `type`. Check `type`, not the text of `message`. Parameter and key errors also carry `errors`, one entry per problem (`message`, `param`, `type`); the top-level `message` and `type` repeat the API key's entry when there is one, otherwise the first.

    | `type` | HTTP | Meaning |
    | --- | --- | --- |
    | `MISSING_PARAMETER` | 400 | A required parameter was not sent |
    | `INVALID_PARAMETER` | varies | A parameter has a value the endpoint cannot use |
    | `INVALID_POOL` | 400 | `/purchase/sms`: the `pool` name does not exist |
    | `INVALID_KEY` | 401 / 403 | The API key is malformed (401) or unknown or revoked (403) |
    | `API_KEY_SCOPE` | 403 | The API key is not allowed to call this endpoint, or not from this IP address |
    | `RATE_LIMITED` | 429 | Too many requests; wait for the `Retry-After` header's seconds |
    | `IDEMPOTENCY_IN_PROGRESS` | 409 | The first request with this `Idempotency-Key` has not finished |

    Endpoints add their own types (for example `OUT_OF_STOCK`). Older errors may have no `type`.

    ## Idempotent purchases

    `/purchase/sms`, `/purchase/rental`, `/esim/purchase` and `/voucher/generate` accept an optional `Idempotency-Key` header (or an `idempotency_key` parameter): 1 to 128 printable ASCII characters that you choose, unique per purchase, for example a UUID. If a request times out, send it again with the same key:

    - the first request runs normally;
    - a repeat within 24 hours answers with the first request's status and body and the header `Idempotent-Replay: true`, and buys nothing;
    - a repeat while the first is still running answers `409` with `type: IDEMPOTENCY_IN_PROGRESS`; retry shortly.

    A request that bought nothing (`success: 0`) does not use up its key, so it can be retried with the same one. A key belongs to your account and the endpoint. Requests without a key behave as they always have.

    ## Webhooks

    Instead of polling `/sms/check`, set a webhook URL under Settings → Developer and receive each SMS as a signed JSON `POST`. The events are listed under Webhooks below; setup, retries and signature checks are described in [How to set up webhooks](https://www.smspool.net/article/how-to-setup-webhooks-for-smspool-ec19b80ade92).

    ## Health check

    `GET /up` needs no key and answers `200 {"status":"ok",...}` or `503 {"status":"degraded",...}`.
  title: SMSPool API
  version: "1.0"
servers:
- url: https://api.smspool.net
tags:
- description: "Look up countries, services, pools, success rates and your balance."
  name: Information
- name: SMS
- name: Preorders
- description: All endpoints for long-term orders
  name: Rental
- name: Pricing
- name: Carrier
- description: These endpoints can only be reached by business accounts.
  name: Business
- description: Please keep in mind that this endpoint is only accessible for users
    that have special permissions to generate and maintain vouchers.
  name: Voucher
- description: Service health.
  name: Status
- description: Events SMSPool sends to your webhook URL (Settings → Developer).
  name: Webhooks
paths:
  /request/success_rate:
    post:
      description: |-
        This API endpoint is used to retrieve success per country for SMSPool requests. It sends an HTTP POST request to the URL `https://api.smspool.net/request/success_rate`.

        Please use either the service ID, or the service name as service param.
      operationId: request_success_rate
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/request_success_rate_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                  - country: 1
                    success_rate: "100"
                    price: "0.80"
                    low_price: "0.24"
                    country_id: 1
                    name: United States
                    short_name: US
                  - country: 2
                    success_rate: "1"
                    price: "0.10"
                    low_price: "0.10"
                    country_id: 2
                    name: United Kingdom
                    short_name: GB
                  - country: 4
                    success_rate: "2"
                    price: "0.10"
                    low_price: "0.10"
                    country_id: 4
                    name: Russia
                    short_name: RU
              schema: {}
          description: OK
        "400":
          content:
            application/json:
              examples:
                "400":
                  summary: "400"
                  value:
                    success: 0
                    message: You are missing a required parameter for this request.
                    type: MISSING_PARAMETER
                    errors:
                    - message: You are missing a required parameter for this request.
                      param: service
                      description: Service name or service ID which can be retrieved
                        at the /service/retrieve_all endpoint
                      type: MISSING_PARAMETER
              schema: {}
          description: Error
      security: []
      summary: Retrieve country success rates per service
      tags:
      - Information
  /request/auto_country:
    post:
      description: |-
        Returns the country SMSPool would order from for this service when you do not want to choose one (the quick order's "Pick for me"). It sends an HTTP POST request to the URL `https://api.smspool.net/request/auto_country`.

        Every country with stock is scored on its expected success rate, weighed down when little stock backs it, minus a little per dollar, plus a bonus when it matches the country your request's IP resolves to (a local number verifies more often). The IP country is only used for that comparison; it is neither stored nor returned. Ties go to more stock, then the lower price. With `pricing_option=1` the cheapest country within reach of the best score wins instead.

        `success_rate` is that expected rate. Where the service has at least 20 recent orders in the country it is the measured rate and `rate_measured` is true. With fewer, it is an estimate that blends those orders (`rate_orders` of them) with how the country does across all services and how the service does elsewhere, and `rate_measured` is false.

        Send `auto_country=1` to `/purchase/sms` to order with the same choice in one call.
      operationId: request_auto_country
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/request_auto_country_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                    country_id: 1
                    name: United States
                    short_name: US
                    price: "0.80"
                    low_price: "0.24"
                    success_rate: 94
                    stock: 1320
                    matches_ip: true
                    rate_measured: true
                    rate_orders: 4210
                    score: 119.52
                    reason: "local number, 94% success, 1320 in stock"
                    success: 1
                "200_-_no_country_has_stock":
                  summary: 200 - no country has stock
                  value:
                    success: 0
                    message: No country has stock for this service right now.
              schema: {}
          description: OK
        "400":
          content:
            application/json:
              examples:
                "400":
                  summary: "400"
                  value:
                    success: 0
                    message: You are missing a required parameter for this request.
                    type: MISSING_PARAMETER
                    errors:
                    - message: You are missing a required parameter for this request.
                      param: service
                      description: Service name or service ID which can be retrieved
                        at the /service/retrieve_all endpoint
                      type: MISSING_PARAMETER
              schema: {}
          description: Error
      security: []
      summary: Pick the best country for a service
      tags:
      - Information
  /request/balance:
    post:
      description: |-
        Retrieves your account balance in USD.

        ### Request Parameters

        Only your API key, sent as a bearer token.

        ### Response

        A JSON object with a `balance` field: the balance as a string with two decimals, for example `"5.00"`.
      operationId: request_balance
      responses:
        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                    balance: "5.00"
              schema: {}
          description: OK
        "400":
          content:
            application/json:
              examples:
                "400":
                  summary: "400"
                  value:
                    success: 0
                    message: You are missing a required parameter for this request.
                    type: MISSING_PARAMETER
                    errors:
                    - message: You are missing a required parameter for this request.
                      param: key
                      description: Your API key which can be found on your settings
                        page at /my/settings
                      type: MISSING_PARAMETER
              schema: {}
          description: Error
        "401":
          content:
            application/json:
              example:
                success: 0
                message: Invalid API key
                type: INVALID_KEY
                errors:
                - message: Invalid API key
                  param: key
                  type: INVALID_KEY
              schema: {}
          description: Malformed API key
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: "403"
                  value:
                    success: 0
                    message: Invalid API key
                    type: INVALID_KEY
                    errors:
                    - message: Invalid API key
                      param: key
                      description: Your API key which can be found on your settings
                        page at /my/settings
                      type: INVALID_KEY
              schema: {}
          description: Error
      security:
      - bearerAuth: []
      summary: Balance
      tags:
      - Information
  /request/suggested_countries:
    post:
      description: |-
        This API endpoint is used to retrieve suggested countries for SMS pool requests. It sends an HTTP POST request to the URL `https://api.smspool.net/request/suggested_countries`.

        Please use either the service ID, or the service name as service param.
      operationId: request_suggested_countries
