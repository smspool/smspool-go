x-webhooks:
  order.code:
    post:
      tags:
      - Webhooks
      summary: An SMS arrived for an order
      description: "One event per SMS. `orderid`, `sms`, `full_sms`, `type` and `timestamp`\
        \ are kept for older integrations; prefer `order_code`, `code`, `full_code`\
        \ and `unix_timestamp`."
      security: []
      parameters:
      - name: X-SMSPool-Event
        in: header
        required: true
        schema:
          type: string
          description: "The event type: `order.code`"
      - name: X-SMSPool-Event-Id
        in: header
        required: true
        schema:
          type: string
          description: Unique per event; the same on every retry
      - name: X-SMSPool-Signature
        in: header
        required: true
        schema:
          type: string
          description: "`t=<unix time>,v1=<hex HMAC-SHA256 of \"<t>.<raw body>\" with\
            \ your signing secret>`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              event: order.code
              event_id: evt_6f1c0e9a2b4d8f7e1a3c5b90
              orderid: AB12CD34
              sms: "123456"
              full_sms: Your verification code is 123456
              type: short_term
              order_code: AB12CD34
              status: completed
              code: "123456"
              full_code: Your verification code is 123456
              phonenumber: "14155550123"
              timestamp: 2026-10-18 02:15:09pm
              unix_timestamp: 1792332909
      responses:
        "200":
          description: "Answer with any 2xx status within 5 seconds. Anything else\
            \ is retried after 15, 45 and 90 seconds; 410 is not retried."
