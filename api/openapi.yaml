                  - pool: 4
                    name: Delta
                    custom_area: 0
                    price: "0.32"
                  - pool: 2
                    name: Bravo
                    custom_area: 0
                    price: "1.16"
                  - pool: 3
                    name: Charlie
                    custom_area: 0
                    price: "0.48"
              schema: {}
