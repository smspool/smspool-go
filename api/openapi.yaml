      security:
      - bearerAuth: []
      summary: Retrieve vouchers
      tags:
      - Voucher
  /voucher/delete:
    post:
      operationId: voucher_delete
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/voucher_delete_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: JSON response
        "401":
          content:
            application/json:
              example:
                success: 0
                message: Invalid API key
                type: INVALID_KEY
                errors:
                - message: Invalid API key
                  param: key
                  type: INVALID_KEY
              schema: {}
          description: Malformed API key
        "403":
          content:
            application/json:
              example:
                success: 0
                message: Invalid API key
                type: INVALID_KEY
                errors:
                - message: Invalid API key
                  param: key
                  type: INVALID_KEY
              schema: {}
          description: Unknown or revoked API key
      security:
      - bearerAuth: []
      summary: Delete voucher
      tags:
      - Voucher
  /voucher/bulk_generate:
    post:
      operationId: voucher_bulk_generate
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/voucher_bulk_generate_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: JSON response
        "401":
          content:
            application/json:
              example:
                success: 0
                message: Invalid API key
                type: INVALID_KEY
                errors:
                - message: Invalid API key
                  param: key
                  type: INVALID_KEY
              schema: {}
          description: Malformed API key
        "403":
          content:
            application/json:
              example:
                success: 0
                message: Invalid API key
                type: INVALID_KEY
                errors:
                - message: Invalid API key
                  param: key
                  type: INVALID_KEY
              schema: {}
          description: Unknown or revoked API key
      security:
      - bearerAuth: []
      summary: Bulk generate vouchers
      tags:
      - Voucher
  /up:
    get:
      description: For uptime monitors. Needs no API key. `db` and `cache` say whether
        the database and the cache answered; `status` is `ok` when both did. The result
        is refreshed every few seconds.
      operationId: up
      responses:
        "200":
          content:
            application/json:
              examples:
                "200_-_healthy":
                  summary: 200 - healthy
                  value:
                    status: ok
                    db: true
                    cache: true
              schema: {}
          description: OK
        "503":
          content:
            application/json:
              examples:
                "503_-_degraded":
                  summary: 503 - degraded
                  value:
                    status: degraded
                    db: false
                    cache: true
              schema: {}
          description: Error
      security: []
      summary: Health check
      tags:
      - Status
