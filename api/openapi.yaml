          example: 0.01
          type: number
        pricing_option:
          description: "Set to 0 if you'd like the cheapest numbers, set to 1 for\
            \ highest success rate"
          type: integer
        quantity:
          description: "Quantity of numbers ordered, 1 to 20. Must be a whole number."
          example: 2
          type: integer
        areacode:
          description: Areacodes you would like to include or exclude in JSON format
          type: string
        exclude:
          description: Set exclude to 1 if you would like to exclude all listed area
            codes.
          type: integer
        create_token:
          description: Optional param; set to 1 if you'd like to create a token link
            that anyone can access.
          example: 0
          type: integer
        activation_type:
          description: "Options: SMS, VOICE, FLASH. SMS will receive regular SMS,\
            \ VOICE will receive phone calls that mentions the SMS and FLASH is for\
            \ FLASH calls for verification."
          example: SMS
          type: string
        carrier:
          description: "Options: 1 or 2. Pick a carrier (only works for pool Foxtrot\
            \ US)"
          type: integer
        phonenumber:
          description: "In case you want to select a specific phone number to order.\
            \ Digits with the country code; a leading +, spaces and dashes are ignored."
          type: integer
        auto_country:
          description: "Set to 1 to let SMSPool pick the country: every country with\
            \ stock is scored on its expected success rate (estimated from the country's\
            \ record across all services when the service has few orders there; weighed\
            \ down when little stock backs it, minus a little per dollar) with a bonus\
            \ for a local number, the country your request's IP resolves to; with\
            \ pricing_option=1 the cheapest country close to the best score wins.\
            \ Ignored when country is sent. The response then carries auto_country\
            \ with the chosen country and the reason."
          example: 0
          type: integer
        response:
          description: "Set to `v2` for one response shape whatever the quantity:\
            \ `{success, orders, failed, message}`. Leave out for the legacy shapes."
          example: v2
          type: string
        software:
          type: integer
      required:
      - service
      type: object
