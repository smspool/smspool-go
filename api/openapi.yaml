              schema: {}
          description: OK
      security: []
      summary: Service list
      tags:
      - Information
  /pool/retrieve_all:
    post:
      description: This API endpoint is used to retrieve a list of our active pools
        for SMSPool requests. It sends an HTTP POST request to the URL `https://api.smspool.net/pool/retrieve_all`.
      operationId: pool_retrieve_all
      responses:
        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                  - ID: 0
                    name: Default
                  - ID: 2
                    name: Bravo
                  - ID: 3
                    name: Charlie
              schema: {}
          description: OK
      security: []
      summary: Pool list
      tags:
      - Information
  /purchase/sms:
    post:
      description: |-
        Orders one or more numbers for a service.

        ### Response shapes

        Without `response=v2` the shape depends on `quantity`: one number returns the order object; several return a JSON array of order objects; if ordering stops part-way, an object with the orders bought so far under `"0"`, `"1"`, ... plus `message`.

        With `response=v2` every case returns the same object:

        - `success`: 1 when every requested number was ordered, otherwise 0
        - `orders`: the orders that were placed (may be empty)
        - `failed`: the error that stopped the request, as a one-element list (empty on success)
        - `message`: a summary
        - `auto_country`: only with `auto_country=1`, the chosen country

        `response=v2` is ignored together with `create_token=1`.

        ### Pool

        `pool` is a pool ID or name from the `Pool List` endpoint. A name that does not exist answers 400 with `type: INVALID_POOL`. Leave it out (or send it empty or `0`) for any pool.

        ### Retrying safely

        Send an `Idempotency-Key` header so a retry after a timeout cannot buy twice.
      operationId: purchase_sms
      parameters:
      - explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          description: "Optional. A value you choose (1 to 128 printable ASCII characters),\
            \ unique per purchase. A repeat of the request with the same key within\
            \ 24 hours returns the first response with `Idempotent-Replay: true` instead\
            \ of buying again; a repeat while the first is still running answers 409\
            \ `IDEMPOTENCY_IN_PROGRESS`. Can also be sent as an `idempotency_key`\
            \ parameter."
          example: 3f1c2c0e-7d5b-4a52-9a53-1f6f0f0f2b11
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/purchase_sms_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                "200_-_successful_order":
                  summary: 200 - successful order
                  value:
                    success: 1
                    number: 1234567890
                    cc: "1"
                    phonenumber: "234567890"
                    order_id: ABCDEFGH
                    country: United States
                    service: Service
                    pool: 1
                    expires_in: 1200
                    expiration: 1705309968
                    message: "You have succesfully ordered a Service number from pool:\
                      \ Foxtrot for 0.24."
                    cost: "0.24"
                    cost_in_cents: 24
                "200_-_created_SMS_token":
                  summary: 200 - created SMS token
                  value:
                    success: 1
                    cc: "1"
                    phonenumber: "2334567890"
                    url: https://api.smspool.net/token/smKngIHort75qUBDXH0lKng1Orr4r9e8
                    token: smKngIHort75qUBDXH0lKng1Orr4r9e8
                    message: Your token has been created succesfully!
                "200_-_response_v2_two_numbers_ordered":
                  summary: "200 - response=v2, two numbers ordered"
                  value:
                    success: 1
                    orders:
                    - success: 1
                      number: 1234567890
                      cc: "1"
                      phonenumber: "234567890"
                      order_id: ABCDEFGH
                      country: United States
                      service: Service
                      pool: 1
                      expires_in: 1200
                      expiration: 1705309968
                      message: "You have succesfully ordered a Service number from\
                        \ pool: Foxtrot for 0.24."
                      cost: "0.24"
                      cost_in_cents: 24
                    - success: 1
                      number: 1234567891
                      cc: "1"
                      phonenumber: "234567891"
                      order_id: ABCDEFGJ
                      country: United States
                      service: Service
                      pool: 1
                      expires_in: 1200
                      expiration: 1705309968
                      message: "You have succesfully ordered a Service number from\
                        \ pool: Foxtrot for 0.24."
                      cost: "0.24"
                      cost_in_cents: 24
                    failed: []
                    message: Ordered 2 numbers.
                "200_-_response_v2_stopped_after_one_of_two":
                  summary: "200 - response=v2, stopped after one of two"
                  value:
                    success: 0
                    orders:
                    - success: 1
                      number: 1234567890
                      cc: "1"
                      phonenumber: "234567890"
                      order_id: ABCDEFGH
                      country: United States
                      service: Service
                      pool: 1
                      expires_in: 1200
                      expiration: 1705309968
                      message: "You have succesfully ordered a Service number from\
                        \ pool: Foxtrot for 0.24."
                      cost: "0.24"
                      cost_in_cents: 24
                    failed:
                    - success: 0
                      message: "Insufficient balance, the price is: 0.24 while you\
                        \ only have: 0.00"
                      type: BALANCE_ERROR
                    message: "Ordered 1 of 2 numbers. Insufficient balance, the price\
                      \ is: 0.24 while you only have: 0.00"
              schema: {}
          description: OK
        "400":
          content:
            application/json:
              examples:
                "400_-_unknown_pool_name":
                  summary: 400 - unknown pool name
                  value:
                    success: 0
                    message: Invalid pool
                    type: INVALID_POOL
                    errors:
                    - message: Invalid pool
                      param: pool
                      type: INVALID_POOL
              schema: {}
          description: Error
        "401":
          content:
            application/json:
              example:
                success: 0
                message: Invalid API key
                type: INVALID_KEY
                errors:
                - message: Invalid API key
                  param: key
                  type: INVALID_KEY
              schema: {}
          description: Malformed API key
        "403":
          content:
            application/json:
              example:
                success: 0
                message: Invalid API key
                type: INVALID_KEY
                errors:
                - message: Invalid API key
                  param: key
                  type: INVALID_KEY
              schema: {}
          description: Unknown or revoked API key
        "409":
          content:
            application/json:
              examples:
                "409_-_Idempotency-Key_still_in_progress":
                  summary: 409 - Idempotency-Key still in progress
                  value:
                    success: 0
                    message: "A request with this Idempotency-Key is still being processed,\
                      \ please retry shortly."
                    type: IDEMPOTENCY_IN_PROGRESS
              schema: {}
          description: Error
        "422":
          content:
            application/json:
              examples:
                "422_-_OUT_OF_STOCK":
                  summary: 422 - OUT_OF_STOCK
                  value:
                    message: "<p>Pool <b>Foxtrot</b>: <p>We couldn't find an available\
                      \ phone number for you, please try again later!</p></p>"
                    success: 0
                    pools:
                      Foxtrot:
                        success: 0
                        message: "<p><b>Foxtrot</b> <p>We couldn't find an available\
                          \ phone number for you, please try again later!</p></p>"
                        errors:
                        - message: "We couldn't find an available phone number for\
                            \ you, please try again later!"
                        type: OUT_OF_STOCK
                    errors:
                    - message: "We couldn't find an available phone number for you,\
                        \ please try again later!"
                    type: OUT_OF_STOCK
                "422_-_no_price_found_with_min_price":
                  summary: 422 - no price found with min price
                  value:
                    success: 0
                    message: "We could not find a suitable pool below the price of:\
                      \ 0.01"
                    type: PRICE_NOT_FOUND
                "422_-_no_balance":
                  summary: 422 - no balance
                  value:
                    message: "<p>Pool <b>Foxtrot</b>: Insufficient balance, the price\
                      \ is: 0.24 while you only have: 0.00</p>"
                    success: 0
                    pools:
                      Foxtrot:
                        success: 0
                        message: "<p><b>Foxtrot</b> Insufficient balance, the price\
                          \ is: 0.24 while you only have: 0.00</p>"
                        type: BALANCE_ERROR
                    type: BALANCE_ERROR
              schema: {}
          description: Error
      security:
      - bearerAuth: []
      summary: Order SMS
      tags:
      - SMS
  /sms/check:
    post:
      description: "You may run into ratelimits while using this endpoint for high\
        \ rate requests, we recommend using /request/active instead as it will list\
        \ all your orders at the same time."
      operationId: sms_check
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/sms_check_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                "200_-_order_pending":
                  summary: 200 - order pending
                  value:
                    status: 1
                    resend: 0
                    expiration: 1704562249
                    time_left: 1173
                "200_-_order_refunded":
                  summary: 200 - order refunded
                  value:
                    status: 6
                    message: This order has been refunded
                    resend: 0
                    expiration: 1704562249
                    time_left: 1134
                "200_-_order_complete":
                  summary: 200 - order complete
                  value:
                    status: 3
                    sms: "12345"
                    full_sms: "Full code: 12345"
                    expiration: 1704562249
              schema: {}
          description: OK
        "401":
          content:
            application/json:
              example:
                success: 0
                message: Invalid API key
                type: INVALID_KEY
                errors:
                - message: Invalid API key
                  param: key
                  type: INVALID_KEY
              schema: {}
          description: Malformed API key
        "403":
          content:
            application/json:
              example:
                success: 0
                message: Invalid API key
                type: INVALID_KEY
                errors:
                - message: Invalid API key
                  param: key
                  type: INVALID_KEY
              schema: {}
          description: Unknown or revoked API key
      security:
      - bearerAuth: []
      summary: Check SMS
      tags:
      - SMS
  /request/active:
    post:
      description: "The recommended endpoint to retrieve your current active orders,\
        \ this will display all your orders at the same time. We recommend using this\
        \ endpoint to iterate through your active orders to retrieve your SMS messages."
      operationId: request_active
      responses:
        "200":
          content:
